# 复制本文件为 config.yaml 后修改真实值；config.yaml 已在 .gitignore 中，不会入库
# 切换环境：设置环境变量 TEST_ENV=prod
# 账号角色对应关系：admin=ADMIN，T001/T002=TEACHER，202601 等学号=STUDENT

local:
  base_url: "http://localhost:8080"
  db:
    host: "localhost"
    port: 3306
    user: "root"
    password: "YOUR_DB_PASSWORD"
    database: "student_web"
  admin:
    username: "admin"
    password: "YOUR_ADMIN_PASSWORD"
  teacher:
    username: "T001"
    password: "YOUR_TEACHER_PASSWORD"
  student:
    username: "202601"
    password: "YOUR_STUDENT_PASSWORD"

prod:
  base_url: "http://YOUR_HOST"
  admin:
    username: "admin"
    password: "YOUR_ADMIN_PASSWORD"
